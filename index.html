<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8a5c9">
<title>Mood Glyph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Silkscreen:wght@400;700&family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ui: #fff200; --bg: #f8a5c9; --uifont: "Silkscreen", "JetBrains Mono", monospace;
    --pad: clamp(12px, 2.5vw, 28px);
    --top: calc(var(--pad) + env(safe-area-inset-top, 0px));
    --bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px));
    --left: calc(var(--pad) + env(safe-area-inset-left, 0px));
    --right: calc(var(--pad) + env(safe-area-inset-right, 0px));
  }
  body.type { --ui: #000; --bg: #93b8fb; --uifont: "Space Grotesk", system-ui, sans-serif; }
  body.figure { --ui: #000; --bg: #fff; --uifont: "Figtree", system-ui, sans-serif; }
  body.figure .title { font-weight: 500; letter-spacing: -0.01em; font-size: clamp(20px, 2.4vw, 32px); }
  body.figure .btn { border-width: 1px; font-weight: 500; }
  body.figure .say input { background: rgba(255,255,255,.85); }
  body.figure .mood { display: none; }
  body.figure .cue { font-weight: 400; color: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ui); font-family: var(--uifont);
               overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
               -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* kept "visible" but invisible: iOS Safari stops decoding frames for display:none video */
  video { position: fixed; top: 0; left: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; position: absolute; }
  .title { top: var(--top); left: var(--left); margin: 0; font-weight: 700;
           font-size: clamp(22px, 4.6vw, 64px); line-height: 1; letter-spacing: 0.02em; }
  .controls { top: var(--top); right: var(--right); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .swatches { display: flex; border: 2px solid var(--ui); }
  body.type .swatches, body.figure .swatches { display: none; }
  .swatches button { width: 22px; height: 22px; border: 0; padding: 0; cursor: pointer; }
  .swatches button[aria-pressed="true"] { outline: 3px solid var(--ui); outline-offset: -5px; }
  .btn { font: inherit; font-size: 14px; background: transparent; color: var(--ui); border: 2px solid var(--ui);
         padding: 4px 10px; cursor: pointer; }
  .btn[aria-pressed="true"] { background: var(--ui); color: var(--bg); }
  .tabs { display: flex; }
  .tabs .btn + .btn { border-left-width: 0; }
  .tabs .btn[aria-selected="true"] { background: var(--ui); color: var(--bg); }
  .say { display: none; left: 50%; transform: translateX(-50%); bottom: var(--bottom);
         width: min(620px, calc(100% - 2 * var(--pad))); }
  body.figure .say { display: block; }
  .say input { width: 100%; font: 400 18px "Figtree", system-ui, sans-serif; color: #000; background: #fff;
               border: 1px solid #000; padding: 12px 14px; border-radius: 0; -webkit-user-select: text; user-select: text; }
  .say input:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  body.figure .status, body.figure .mood { bottom: calc(var(--bottom) + 66px); }
  @media (max-width: 640px) { .cue { bottom: calc(var(--bottom) + 150px); } }
  body.figure .hint { display: none; }
  .figure-only { display: none !important; }
  body.figure .figure-only { display: inline-flex !important; align-items: center; }
  label.btn { cursor: pointer; }
  .cue { display: none; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom) + 112px);
         font-size: clamp(14px, 1.8vw, 20px); font-weight: 500; text-align: center; width: min(520px, 90%); }
  body.figure .cue { display: block; }
  button:focus-visible { outline: 3px solid var(--ui); outline-offset: 3px; }
  .status { bottom: var(--bottom); left: var(--left); display: flex; align-items: center; gap: 12px;
            font-size: clamp(18px, 3.4vw, 44px); font-weight: 700; }
  .dot { width: 0.8em; height: 0.8em; border-radius: 50%; background: #ff3b3b; transition: background .2s; flex: none; }
  .dot.on { background: #00d084; }
  .mood { bottom: var(--bottom); right: var(--right); font-size: clamp(24px, 5vw, 72px); font-weight: 700; line-height: 1; text-align: right; }
  .hint { bottom: calc(var(--bottom) + clamp(40px, 6vw, 80px)); left: var(--left); font-size: 12px; opacity: .8; }

  /* touch devices: bigger targets, no keyboard hint */
  @media (pointer: coarse) {
    .hint { display: none; }
    .swatches button { width: 36px; height: 36px; }
    .btn { font-size: 15px; min-height: 40px; padding: 6px 12px; }
  }
  /* narrow screens: controls drop below the title, status shrinks to just the dot */
  @media (max-width: 640px) {
    .title { font-size: 24px; }
    .controls { top: calc(var(--top) + 36px); left: var(--left); right: auto; justify-content: flex-start; }
    #statusText { display: none; }
    .status { font-size: 22px; }
    .mood { font-size: clamp(24px, 8vw, 40px); max-width: calc(100% - 80px); }
  }

  .start { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10;
           padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); text-align: center; }
  .start h2 { font-size: clamp(56px, 12vw, 120px); margin: 0 0 12px; line-height: .95; }
  .start p { max-width: 36ch; margin: 0 auto 24px; font-family: "Space Grotesk", sans-serif; font-size: 18px; line-height: 1.4; }
  .start button { font: inherit; font-size: 22px; background: var(--ui); color: var(--bg); border: 0; padding: 16px 28px; cursor: pointer; min-height: 56px; }
  .start .err { color: #b00020; background: #fff; padding: 10px 14px; margin-top: 18px; font-family: "Space Grotesk", sans-serif; font-size: 15px; display: none; max-width: 40ch; }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>

<div class="hud">
  <h1 class="title" id="title">Glyph mirror</h1>
  <div class="controls">
    <div class="swatches" id="swatches" aria-label="Palette"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="btn" role="tab" data-mode="ascii">Glyphs</button>
      <button class="btn" role="tab" data-mode="type">Type face</button>
      <button class="btn" role="tab" data-mode="figure">Word body</button>
    </div>
    <button class="btn figure-only" id="musicBtn" aria-pressed="false">Play music</button>
    <button class="btn" id="snapBtn" title="Save image (S)">Save</button>
    <button class="btn" id="debugBtn" title="Show face values (D)" aria-pressed="false">Values</button>
  </div>
  <div class="hint" id="hint">M mode · 1–4 palette · S save · D values</div>
  <div class="status"><span class="dot" id="dot" aria-hidden="true"></span><span id="statusText">No face</span></div>
  <div class="mood" id="mood" aria-live="polite">…</div>
  <div class="cue" id="cue" aria-live="polite"></div>
  <label class="say"><span class="sr">Your sentence</span>
    <input id="sentence" type="text" maxlength="600" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"
           placeholder="Type a sentence to grow a body" value="I am exactly as big as what I have to say.">
  </label>
</div>

<div class="start" id="start">
  <div>
    <h2>(•_•)</h2>
    <p>Your face drives the page. Make faces at the camera and watch them get translated into glyphs.</p>
    <button id="go">Turn on camera</button>
    <div class="err" id="err"></div>
  </div>
</div>

  fs = Math.max(8, Math.min(16, Math.round(W / (targetCols * 0.6))));
  ctx.font = `500 ${fs}px "JetBrains Mono", monospace`;
  cw = ctx.measureText("M").width; chH = fs;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chH);
  small.width = cols; small.height = rows;

function snapshot() {
  canvas.toBlob(async blob => {
    const name = `mood-glyph-${current}.png`;
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Mood Glyph" }); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.download = name; a.href = URL.createObjectURL(blob); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}

/* ---------- tracking ---------- */
function crop() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw / vh > W / H) { const sw = vh * W / H; return { sx: (vw - sw) / 2, sy: 0, sw, sh: vh, vw, vh }; }
  const sh = vw * H / W; return { sx: 0, sy: (vh - sh) / 2, sw: vw, sh, vw, vh };
}
function toScreen(p, c) {
  const x = (p.x * c.vw - c.sx) / c.sw * W, y = (p.y * c.vh - c.sy) / c.sh * H;
  return { x: W - x, y };             // mirrored
}
const lerp = (a, b, t) => a + (b - a) * t;

function handle(res, now) {
  if (res.faceLandmarks && res.faceLandmarks.length) {
    const L = res.faceLandmarks[0], c = crop();
    const e1 = toScreen(L[33], c), e2 = toScreen(L[263], c), nose = toScreen(L[1], c);
    const l = toScreen(L[234], c), r = toScreen(L[454], c);
    const [a, b] = e1.x < e2.x ? [e1, e2] : [e2, e1];
    const tx = (a.x + b.x) / 2 * .6 + nose.x * .4, ty = (a.y + b.y) / 2 * .6 + nose.y * .4;
    const k = face.seen ? .35 : 1;
    face.x = lerp(face.x, tx, k); face.y = lerp(face.y, ty, k);
    face.w = lerp(face.w, Math.hypot(r.x - l.x, r.y - l.y), k);
    face.roll = lerp(face.roll, Math.atan2(b.y - a.y, b.x - a.x), k);
    face.nx = face.x / W; face.ny = face.y / H;
    face.lm = face.lm && face.seen ? L.map((q, i) => ({ x: lerp(face.lm[i].x, q.x, .5), y: lerp(face.lm[i].y, q.y, .5) })) : L;
    face.seen = true; face.lastSeen = now;
    for (const cat of res.faceBlendshapes[0].categories)
      bs[cat.categoryName] = lerp(bs[cat.categoryName] ?? 0, cat.score, .35);
  } else if (now - face.lastSeen > 300) face.seen = false;
  trackPeople(res, now);
}

function vals(src = bs) {
  const g = n => src[n] || 0;
  let L = "Left", R = "Right"; if (SWAP_LR) [L, R] = [R, L];
  return {
    blinkL: g("eyeBlink" + L), blinkR: g("eyeBlink" + R),
    blink: (g("eyeBlinkLeft") + g("eyeBlinkRight")) / 2,
    wide: (g("eyeWideLeft") + g("eyeWideRight")) / 2,
    smile: (g("mouthSmileLeft") + g("mouthSmileRight")) / 2,
    frown: (g("mouthFrownLeft") + g("mouthFrownRight")) / 2,
    browDownL: g("browDown" + L), browDownR: g("browDown" + R),
    browDown: (g("browDownLeft") + g("browDownRight")) / 2,
    browOutL: g("browOuterUp" + L), browOutR: g("browOuterUp" + R),
    browUp: g("browInnerUp"), jaw: g("jawOpen"), pucker: g("mouthPucker"),
  };
}

function classify(v, seen = face.seen) {
  if (!seen) return "none";
  if (Math.abs(v.blinkL - v.blinkR) > T.wink && Math.max(v.blinkL, v.blinkR) > .5) return "cheeky";
  if (v.blink > T.blink) return "sleepy";
  if (v.jaw > T.jaw && v.browUp > T.shockBrow) return "shocked";
  if (v.jaw > T.jaw) return "surprised";
  if (v.smile > T.smile) return "happy";
  if (v.pucker > T.pucker) return "kissy";
  if (v.browDown > T.browDown) return "angry";
  if (v.frown > T.frown || (v.browUp > T.sadBrow && v.smile < .1)) return "sad";
  return "neutral";
}

/* ---------- mode 2: typographic face ---------- */
const NOISE = "¥§¶ØÆ£$%&#@*+=<>~^/\\|{}[]()¿¡«»±×÷ÐÞßøæœ0123456789";

function drawTypeFace(v, t) {

  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const s = Math.min(W / 1060, H / 1150);
  const hx = face.seen ? (face.nx - .5) * W * .35 : 0, hy = face.seen ? (face.ny - .5) * H * .25 : 0;
  ctx.save();
  ctx.translate(W / 2 + hx, H / 2 + hy); ctx.rotate(face.seen ? face.roll : 0); ctx.scale(s, s);
  ctx.fillStyle = ink; ctx.strokeStyle = ink; ctx.lineJoin = "round";

  // crown of letters: a V that deepens when you scowl, flattens when brows go up
  const letter = EXPR[current].word[0].toLowerCase();
  const depth = 200 + v.browDown * 240 - v.browUp * 160;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  for (let i = -8; i <= 8; i++) {
    const tt = i / 8, a = 1 - Math.abs(tt);

    ctx.fillText(letter, tt * 460, -470 + Math.pow(a, 1.6) * depth + Math.sin(t / 400 + i) * 4);

    ctx.save();

    ctx.closePath(); ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 10; ctx.stroke();
    ctx.restore();

  // eyes: giant closing-quote marks that squash when you blink
  ctx.font = `230px "Archivo Black", sans-serif`;
  for (const side of [-1, 1]) {
    const open = 1 - (side < 0 ? v.blinkL : v.blinkR);
    ctx.save(); ctx.translate(side * 175, 30);

      const [x, y] = centered("\u201D");
      ctx.fillStyle = bg; ctx.fillText("\u201D", x, y);
      ctx.lineWidth = 8; ctx.strokeText("\u201D", x, y);
    }
    ctx.restore();

  const w = 440 * (1 + v.smile * .25 - v.pucker * .45);
  const lift = v.smile * 120 - v.frown * 100;
  const open = 12 + v.jaw * 240;
  const N = Math.max(8, Math.floor(w / 22)), rowH = 24;
  ctx.font = `500 26px "JetBrains Mono", monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let k = 0; k <= N; k++) {
    const u = -1 + 2 * k / N, x = u * w / 2, edge = 380 - lift * u * u, bulge = open / 2 * (1 - u * u);
    const top = edge - bulge, bot = edge + bulge;
    ctx.fillText("=", x, top);
    for (let y = top + rowH; y < bot - rowH * .5; y += rowH)
      ctx.fillText(NOISE[(Math.random() * NOISE.length) | 0], x, y);
    ctx.fillText("=", x, Math.max(bot, top + 14));
  }

/* ---- people: every tracked face gets its own body ---- */
// screen-left side of the mirrored image is the person's left: 11 shoulder, 13 elbow, 15 wrist, 23 hip, 25 knee, 27 ankle
const SIDES = [[-1, [11, 13, 15, 23, 25, 27], "la", "ll"], [1, [12, 14, 16, 24, 26, 28], "ra", "rl"]];
let people = [], nextId = 1;
const limbSlot = () => ({ on: false, t: 0, ang: [0, 0] });
function newPerson(now) {
  return { id: nextId++, born: now, seen: now, poseSeen: -1e9, lm: null, nose: { x: W / 2, y: H / 2 }, bs: {}, S: null,

    ua.add(a); ub.add(b); out.push([a, b]);

}
function trackPeople(res, now) {
  const c = crop();
  const dets = (res.faceLandmarks || []).map((L, i) => ({ L, B: res.faceBlendshapes && res.faceBlendshapes[i], n: toScreen(L[1], c) }));
  const pairs = [];
  people.forEach((p, pi) => dets.forEach((d, di) => pairs.push([Math.hypot(p.nose.x - d.n.x, p.nose.y - d.n.y), pi, di])));
  const { out, ub } = match(pairs, Math.max(W, H) * .25);
  for (const [pi, di] of out) updatePerson(people[pi], dets[di], now);
  dets.forEach((d, di) => {
    if (!ub.has(di) && people.length < MAX_PEOPLE) { const p = newPerson(now); people.push(p); updatePerson(p, d, now); }

  people.forEach((p, pi) => poses.forEach((S, si) => pairs.push([Math.hypot(p.nose.x - S[0].x, p.nose.y - S[0].y), pi, si])));

/* ---- Y, M, C, A ---- */
const YMCA = "YMCA";
const seq = { idx: 0, hold: 0, last: 0, flash: 0 };   // idx = how many letters done

  const x1 = a.x - b.x, y1 = a.y - b.y, x2 = c.x - b.x, y2 = c.y - b.y;
  return (x1 * x2 + y1 * y2) / (Math.hypot(x1, y1) * Math.hypot(x2, y2) || 1) < -.7;

function poseIs(letter, S) {

  if (need.some(i => S[i].v < .5)) return false;
  const [nose, ls, rs, le, re, lw, rw] = need.map(i => S[i]);
  const sw = Math.hypot(rs.x - ls.x, rs.y - ls.y); if (sw < 10) return false;
  const shY = (ls.y + rs.y) / 2, midX = (ls.x + rs.x) / 2;

function updateSeq(now) {

  if (seq.idx > 0 && now - seq.last > 12000) seq.idx = 0;                  // took too long: back to Y
  const someone = people.some(p => bodySeen(p) && poseIs(YMCA[seq.idx], p.S));   // anyone in frame can do it
  seq.hold = someone ? seq.hold + 1 : 0;
  if (seq.hold >= 8) {                                                      // held for ~1/4 s

}
function drawYmcaLetters(beat) {
  if (!seq.idx) return;
  const text = YMCA.slice(0, seq.idx);

/* ---- detailed body silhouette ---- */
function limb(m, x1, y1, w1, x2, y2, w2) {     // tapered capsule

  m.lineTo(x2 - nx * w2 / 2, y2 - ny * w2 / 2); m.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); m.fill();
  m.beginPath(); m.arc(x1, y1, w1 / 2, 0, Math.PI * 2); m.fill();

function drawHead(cx, cy, hH, lm) {
  if (lm && video.videoWidth) {
    const vw = video.videoWidth, vh = video.videoHeight;
    const pts = OVAL.map(i => [lm[i].x * vw, lm[i].y * vh]);
    let mx = 0, my = 0; pts.forEach(q => { mx += q[0]; my += q[1]; }); mx /= pts.length; my /= pts.length;
    const ex = pts.map(([x, y]) => y < my ? [mx + (x - mx) * 1.12, my + (y - my) * 1.32] : [mx + (x - mx) * 1.04, my + (y - my) * 1.03]);
    let minY = Infinity, maxY = -Infinity; ex.forEach(q => { minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); });
    const sc = hH / (maxY - minY);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(-sc, sc); ctx.translate(-mx, -(minY + maxY) / 2);
    ctx.beginPath(); ex.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.clip();
    ctx.drawImage(video, 0, 0, vw, vh);
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(cx, cy);
    ctx.beginPath(); ctx.ellipse(0, 0, hH * .36, hH * .5, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    ctx.fillStyle = "#000"; ctx.font = `400 ${hH * .25}px Figtree, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 0, 0);
    ctx.restore();
  }
}

let cueText = "";
const ghost = newPerson(-1e9);   // stand-in figure when nobody is in frame
function setCue(t) { if (t !== cueText) { cueText = t; $("cue").textContent = t; } }

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const BG = ["#ffe14d", "#ff7ac1", "#b8ff4d", "#5ee6ff", "#ff9a3c"];   // start, then after Y, M, C, A
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
let bgNow = hex(BG[0]);
function figureBg() {
  const t = hex(BG[seq.idx]);
  bgNow = bgNow.map((c, i) => reduceMotion ? t[i] : lerp(c, t[i], .08));
  const css = `rgb(${bgNow.map(Math.round).join(",")})`;
  document.documentElement.style.setProperty("--bg", css);
  return css;
}
function drawFigure() {
  const beat = Music.pulse();
  ctx.fillStyle = figureBg(); ctx.fillRect(0, 0, W, H);
  drawYmcaLetters(beat);

  const N = letters.length;
  const top = W < 640 ? 140 : 100, bottomY = H - (W < 640 ? 200 : 170), avail = bottomY - top;
  const ry = avail / 2, rx = Math.min(W * .44, ry * .64), cy = top + ry;
  const list = people.length ? people.slice().sort((a, b) => a.nose.x - b.nose.x) : [ghost];
  const slotW = W / list.length;
  // arms up reach .42u above the neck, feet ~1.05u below, arms out ~.65u each side
  const uMax = Math.max(40, Math.min(ry * 1.5 / 1.47, rx * .8 / .65, slotW * .46 / .65));
  const f = Math.max(5, Math.min(11, uMax / 30));
  let armsTracked = false;

  list.forEach((p, idx) => {
    if (updatePose(p)) armsTracked = true;
    const target = slotW * (idx + .5);
    p.slot = p.slot == null ? target : lerp(p.slot, target, .12);      // slide over when someone joins/leaves
    const grow = reduceMotion ? 1 : Math.min(1, (performance.now() - p.born) / 400);
    const u = uMax * (1 - Math.pow(1 - grow, 3));                     // new bodies grow in
    if (u < 8) return;
    const neckY = cy - 1.47 * uMax / 2 + .42 * uMax + (1.47 * uMax - 1.47 * u) * .5 + beat * 2;
    const headH = .26 * u;
    if (N) {
      const r = raster(u, 1, p.pose, f, p.slot, neckY);
      ctx.font = `500 ${f}px Figtree, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
      let i = 0;
      for (let y = 0; y < r.mr; y++) for (let x = 0; x < r.mc; x++) {
        if (r.d[(y * r.mc + x) * 4 + 3] <= 127) continue;
        ctx.fillText(letters[i % N], (x + .5) * r.cwF, (y + .5) * r.chF);   // the sentence repeats until the body is full
        i++;
      }
    }
    drawHead(p.slot, neckY - headH * .45, headH, p === ghost ? null : p.lm);
  });

  const CUES = [
    "Make a Y with your arms to start the music",
    "Now an M: hands on your head, elbows out",
    "Now a C: curve both arms to one side",
    "Now an A: hands together above your head",
    "Y, M, C, A! Go again from the Y",
  ];
  if (!poseLm) setCue("Loading body tracking…");
  else if (!people.length) setCue("Step in front of the camera");
  else if (!armsTracked) setCue("Step back until your arms are in view");
  else setCue(seq.hold > 0 && seq.idx < 4 ? `Hold that ${YMCA[seq.idx]}…` : CUES[seq.idx]);
}

/* ---------- music: only the YMCA clip ---------- */
const Music = {
  song: new Audio(SONG_URL), playing: false,
  start() {
    if (this.playing) return;
    this.playing = true; this.song.currentTime = 0;
    this.song.play().catch(() => { this.playing = false; updateMusicUI(); });
    updateMusicUI();
  },
  stop() { this.playing = false; this.song.pause(); updateMusicUI(); },
  pulse() {                               // 1 on each beat, fading to 0
    if (!this.playing) return 0;
    return Math.pow(1 - ((this.song.currentTime * BPM / 60) % 1), 3);
  },
};
Music.song.loop = true; Music.song.preload = "auto";
function unlockSong() {   // phones only allow audio that was started inside a tap
  const a = Music.song;
  a.muted = true;
  a.play().then(() => { if (!Music.playing) { a.pause(); a.currentTime = 0; } a.muted = false; }).catch(() => { a.muted = false; });
}
function updateMusicUI() {
  $("musicBtn").textContent = Music.playing ? "Stop music" : "Play music";
  $("musicBtn").setAttribute("aria-pressed", Music.playing);
}
$("musicBtn").onclick = () => Music.playing ? Music.stop() : Music.start();

/* ---------- debug bars ---------- */
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawSkeleton() {
  ctx.save(); ctx.strokeStyle = "rgba(0,120,255,.8)"; ctx.lineWidth = 3;
  for (const p of people) {
    if (!bodySeen(p)) continue;
    for (const [a, b] of BONES) {
      const A = p.S[a], B = p.S[b]; if (A.v < .5 || B.v < .5) continue;
      ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawDebug(v) {
  const keys = ["smile", "frown", "jaw", "browUp", "browDown", "blink", "wide", "pucker"];
  const x = 16, y0 = W < 640 ? 130 : H * .22;
  ctx.font = `500 12px "JetBrains Mono", monospace`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  keys.forEach((k, i) => {
    const y = y0 + i * 20;
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y - 8, 200, 16);
    ctx.fillStyle = "#fff"; ctx.fillRect(x + 70, y - 5, 120 * Math.min(1, v[k]), 10);
    ctx.fillText(k, x + 6, y);
  });
}

/* ---------- loop ---------- */
let shownMood = "";
function frame(now) {
  requestAnimationFrame(frame);
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    handle(landmarker.detectForVideo(video, now), now);
  }
  if (poseLm && !poseWarm && mode !== "figure" && video.readyState >= 2) {
    poseLm.detectForVideo(video, now); poseWarm = true;     // first run compiles the model: do it off-screen
  }
  if (mode === "figure" && poseLm && video.readyState >= 2 && video.currentTime !== lastPoseTime) {
    poseWarm = true;
    lastPoseTime = video.currentTime;
    handlePoses(poseLm.detectForVideo(video, now), now);
    updateSeq(now);
  }
  const v = vals();
  const next = classify(v);
  if (next === candidate) candCount++; else { candidate = next; candCount = 0; }
  if (candidate !== current && candCount > 5) current = candidate;

  if (mode === "ascii") drawAscii(); else if (mode === "type") drawTypeFace(v, now); else drawFigure();
  if (debug) { drawDebug(v); if (mode === "figure") drawSkeleton(); }

  if (shownMood !== current) {
    shownMood = current;
    $("mood").textContent = EXPR[current].word;
    $("dot").classList.toggle("on", current !== "none");
    $("statusText").textContent = current !== "none" ? "Tracking" : "No fce";
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
